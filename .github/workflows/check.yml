name: Checks
on:
  push:
  pull_request:
permissions:
  contents: read
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci
      - run: npm run check
      - run: npm run check:tools
      - run: npx playwright install --with-deps chromium
      - run: npm run check:browser
      - if: always()
        uses: actions/upload-artifact@v4
        with:
          name: screenshots
          path: test-results/
